
<!DOCTYPE html>
<html>
<head>
    <title>学信档案</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background: #f5f5f5;
        }

        .container {
            width: 1200px;
            margin: 0px auto;
            background: white;
            padding: 20px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
            position: relative; /* 关键：让按钮相对于此容器定位 */
        }

        img {
            max-width: 100%;
            display: block;
        }


        /* 按钮高等信息 */
        .button-overlay {
            position: absolute;
            padding: 110px 130px;
            font-size: 16px;
            color: white;
            background-color: transparent; /* 完全透明 */
            border: none;                  /* 去除边框 */
            cursor: pointer;
        }


        /* ==========================
           新增：调试模式
        ========================== */

        /* 开启调试模式后，显示按钮区域 */
        body.debug-mode .button-overlay {
            background-color: rgba(255, 0, 0, 0.25);
            outline: 2px solid red;
        }

        /* 显示按钮名称 */
        body.debug-mode .button-overlay::after {
            content: "高等信息";
            position: absolute;
            top: 0;
            left: 0;
            color: white;
            background-color: red;
            font-size: 14px;
            padding: 5px 10px;
            white-space: nowrap;
            pointer-events: none;
        }

    </style>
</head>
<body>
    <div class="container">
        <img src="index.png" alt="学信档案">


        <!-- 高等教育信息按钮 -->
        <button class="button-overlay" onclick="window.location.href='page1.html'" style="top: 1100px; left: 95px;"></button>
	<!-- 在线验证报告按钮 -->
        <button class="button-overlay" onclick="window.location.href='在线验证报告.html'" style="top: 1100px; left: 500px;"></button>

</button>

    </div>


    <!-- ==========================
         新增：调试模式开关
    ========================== -->

    <script>

        // 获取浏览器地址栏参数
        const params = new URLSearchParams(window.location.search);

        // 当网址包含 ?debug=1 时，开启调试模式
        if (params.get("debug") === "1") {
            document.body.classList.add("debug-mode");
        }

    </script>

</body>
</html>
